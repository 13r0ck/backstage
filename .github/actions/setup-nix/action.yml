name: Set up Nix
description: Install Nix and restore the /nix/store cache keyed on the flake.

runs:
  using: composite
  steps:
    # Hosted runners start clean, so Nix is installed each run; this
    # installer takes a few seconds and enables flakes by default.
    - uses: cachix/install-nix-action@v31
    # Saves/restores /nix/store through the regular GitHub Actions cache,
    # so the dev shell (idris2, node, wrangler) isn't re-downloaded each run.
    - uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
