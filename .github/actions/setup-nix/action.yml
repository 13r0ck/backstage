name: Set up Nix
description: Install Determinate Nix with FlakeHub Cache as a binary cache.

# The calling job needs `permissions: id-token: write` so FlakeHub Cache can
# authenticate through GitHub's OIDC token; no secrets are involved.
runs:
  using: composite
  steps:
    # Hosted runners start clean, so Nix is installed each run (a few seconds).
    - uses: DeterminateSystems/determinate-nix-action@v3
    # Substitutes anything already built (backstage, the Idris libraries) and
    # pushes whatever this job builds, so each derivation is built only once.
    - uses: DeterminateSystems/flakehub-cache-action@main
