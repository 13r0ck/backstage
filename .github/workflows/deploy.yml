name: Deploy to Cloudflare Workers

# main          -> https://backstage.regal.workers.dev
# PR branch X   -> https://<slug of X>-backstage.regal.workers.dev, deleted when the PR closes
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command sh scripts/deploy.sh deploy "$BRANCH"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command sh scripts/deploy.sh delete "$BRANCH"
