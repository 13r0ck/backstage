name: Deploy to Cloudflare Workers

# main          -> https://backstage.regal.workers.dev       (production account)
# PR branch X   -> https://<slug of X>.jumble-bust-nugget.workers.dev (dev account), deleted when the PR closes
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  # Pushes to main use the production account; pull requests the dev account.
  CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'push' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DEV_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ github.event_name == 'push' && secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  # Served as the x-commit response header, to tell which version is live.
  BACKSTAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tools
      - run: backstage deploy "$BRANCH"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tools
      - run: backstage delete "$BRANCH"
